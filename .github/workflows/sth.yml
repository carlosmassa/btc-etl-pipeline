name: Update STH and LTH Realized Price
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Append latest STH and LTH
        run: |
          python3 - << 'PY'
          import pandas as pd
          import requests
          from pathlib import Path

          def update(url, path, key, col):
              r = requests.get(url, timeout=60)
              r.raise_for_status()
              rows = r.json()
              new = pd.DataFrame({
                  "Date": pd.to_datetime([x["d"] for x in rows]),
                  col: [float(x[key]) for x in rows],
              })
              p = Path(path)
              df = pd.read_csv(p, parse_dates=["Date"])
              combined = pd.concat([df, new]).drop_duplicates("Date", keep="last").sort_values("Date")
              added = len(combined) - len(df)
              if added > 0:
                  combined.to_csv(p, index=False)
                  print(f"{path}: added {added} rows, now {len(combined)} total, latest {combined['Date'].iloc[-1]:%Y-%m-%d}")
              else:
                  print(f"{path}: no new rows, latest {df['Date'].iloc[-1]:%Y-%m-%d}")

          update("https://bitcoin-data.com/api/v1/sth-realized-price", "data/BTC_STH.csv", "sthRealizedPrice", "STH")
          update("https://bitcoin-data.com/api/v1/lth-realized-price", "data/BTC_LTH.csv", "lthRealizedPrice", "LTH")
          PY
      - name: Commit
        run: |
          git config user.name "Carlos Massa"
          git config user.email "47972273+carlosmassa@users.noreply.github.com"
          git add data/BTC_STH.csv data/BTC_LTH.csv
          git diff --staged --quiet || git commit -m "Update STH and LTH realized prices"
          git push
