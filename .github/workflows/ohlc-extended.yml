name: Update BTC OHLC Daily and 4H
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Append latest daily and 4H
        run: |
          python3 - << 'PY'
          import pandas as pd
          import requests
          from datetime import datetime
          from pathlib import Path
          import time

          def fetch_kraken(interval):
              r = requests.get(f"https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval={interval}", timeout=30)
              r.raise_for_status()
              candles = r.json()["result"]["XXBTZUSD"]
              rows = []
              for c in candles:
                  rows.append({
                      "Date": datetime.utcfromtimestamp(c[0]),
                      "Open": float(c[1]),
                      "High": float(c[2]),
                      "Low": float(c[3]),
                      "Close": float(c[4]),
                      "Volume": float(c[6]),
                  })
              return pd.DataFrame(rows)

          def fetch_okx_daily():
              url = "https://www.okx.com/api/v5/market/history-candles"
              all_candles = []
              after = None
              # Fetch recent history (last few hundred days is enough for daily append)
              for _ in range(5):
                  params = {"instId": "BTC-USDT", "bar": "1Dutc", "limit": "100"}
                  if after:
                      params["after"] = after
                  r = requests.get(url, params=params, timeout=30)
                  r.raise_for_status()
                  data = r.json().get("data", [])
                  if not data:
                      break
                  all_candles.extend(data)
                  after = data[-1][0]
                  time.sleep(0.1)
                  if len(data) < 100:
                      break
              rows = []
              for c in all_candles:
                  rows.append({
                      "Date": datetime.utcfromtimestamp(int(c[0])/1000).strftime("%Y-%m-%d"),
                      "Open": float(c[1]),
                      "High": float(c[2]),
                      "Low": float(c[3]),
                      "Close": float(c[4]),
                      "Volume": float(c[5]),
                  })
              return pd.DataFrame(rows)

          def append(path, new_df):
              p = Path(path)
              if not p.exists():
                  new_df.to_csv(p, index=False)
                  print(f"{path}: created with {len(new_df)} rows")
                  return
              df = pd.read_csv(p, parse_dates=["Date"])
              # Normalize Date column for comparison
              if "Date" in new_df.columns:
                  new_df["Date"] = pd.to_datetime(new_df["Date"])
              combined = pd.concat([df, new_df]).drop_duplicates("Date", keep="last").sort_values("Date")
              if len(combined) > len(df):
                  combined.to_csv(p, index=False)
                  print(f"{path}: added {len(combined) - len(df)} rows, now {len(combined)} total")
              else:
                  print(f"{path}: no new rows")

          append("data/BTC_OHLC_Daily.csv", fetch_kraken(1440))
          append("data/BTC_OHLC_4H.csv", fetch_kraken(240))
          append("data/OKX_BTC_OHLC_Daily.csv", fetch_okx_daily())
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/BTC_OHLC_Daily.csv data/BTC_OHLC_4H.csv data/OKX_BTC_OHLC_Daily.csv
          git diff --staged --quiet || git commit -m "Update BTC OHLC Daily, 4H and OKX Daily for $(date +%Y-%m-%d)"
          git push
