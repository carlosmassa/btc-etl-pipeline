name: Daily BTC/USD ETL Pipeline
on:
  schedule:
    - cron: "0 4 * * *" # Runs daily at 4:00 AM UTC (default branch only)
  workflow_dispatch:
    inputs:
      publish_to_production:
        description: "Also post to X and update the live gh-pages chart (main branch only)"
        type: boolean
        default: false

jobs:
  etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the branch that triggered this run. Do NOT hardcode main:
          # a manual run from dev must test the code on this branch.
          fetch-depth: 0

      - name: Describe run mode
        run: |
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "publish_to_production=${{ inputs.publish_to_production }}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && { [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${{ inputs.publish_to_production }}" = "true" ]; }; then
            echo "MODE=production (X + gh-pages)"
          else
            echo "MODE=dry-run (artifacts only; no X post, no gh-pages update)"
          fi

      - name: List files in the root directory
        run: ls -l

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract data
        run: python extract.py

      - name: Transform data
        run: python transform.py

      - name: Load data
        run: python load.py

      - name: Post chart to X
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish_to_production == true)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python post_to_x.py

      - name: Upload raw data and chart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            raw_btc_usd.csv
            charts/btc_usd_chart.jpg
            charts/btc_usd_chart.html
            btc_usd_chart.html
          if-no-files-found: warn
          retention-days: 7

      - name: Commit chart to gh-pages branch
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish_to_production == true)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          ls -la charts/ || true
          mkdir -p temp
          mv charts/btc_usd_chart.html temp/ || true
          mv charts/btc_usd_chart.jpg temp/ || true
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          mkdir -p charts
          mv temp/btc_usd_chart.html charts/ || true
          mv temp/btc_usd_chart.jpg charts/ || true
          ls -la charts/ || true
          git add charts/btc_usd_chart.html charts/btc_usd_chart.jpg
          git commit -m "Update BTC/USD chart and JPG for $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/carlosmassa/btc-etl-pipeline.git gh-pages
