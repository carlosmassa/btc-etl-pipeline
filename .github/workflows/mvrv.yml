name: Update MVRV Data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Append latest MVRV
        run: |
          python3 - << 'PY'
          import pandas as pd, requests
          from pathlib import Path
          url = "https://bitcoin-data.com/v1/mvrv"
          r = requests.get(url, timeout=60)
          r.raise_for_status()
          mvrv_rows = r.json()
          rp_url = "https://bitcoin-data.com/v1/realized-price"
          rp = requests.get(rp_url, timeout=60).json()
          latest_m = mvrv_rows[-1]
          latest_r = rp[-1]
          date = pd.to_datetime(latest_m["d"])
          path = Path("data/BTC_MVRV.csv")
          df = pd.read_csv(path, parse_dates=["Date"])
          if date in df["Date"].values:
              print(f"{date:%Y-%m-%d} already present")
          else:
              # Get price from the prices CSV
              prices = pd.read_csv("data/BTC_Prices.csv", parse_dates=["Date"]).set_index("Date")
              price = prices.loc[date, "Value"] if date in prices.index else 0
              new = pd.DataFrame({
                  "Date": [date],
                  "Price": [price],
                  "MVRV": [float(latest_m["mvrv"])],
                  "Realized": [float(latest_r["realizedPrice"])]
              })
              df = pd.concat([df, new], ignore_index=True)
              df = df.sort_values("Date").drop_duplicates("Date", keep="last")
              df.to_csv(path, index=False)
              print(f"Added {date:%Y-%m-%d}: MVRV {new['MVRV'].iloc[0]:.3f}")
          PY
      - name: Commit
        run: |
          git config user.name "Carlos Massa"
          git config user.email "47972273+carlosmassa@users.noreply.github.com"
          git add data/BTC_MVRV.csv
          git diff --staged --quiet || git commit -m "Update MVRV data" && git push
