name: Update MVRV Data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Append latest MVRV
        run: |
          python3 - << 'PY'
          import pandas as pd, requests
          from pathlib import Path
          url = "https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=CapMVRVCur&frequency=1d&page_size=10"
          r = requests.get(url, timeout=60)
          r.raise_for_status()
          rows = r.json().get("data", [])
          path = Path("data/BTC_MVRV.csv")
          df = pd.read_csv(path, parse_dates=["Date"]).sort_values("Date")
          prices = pd.read_csv("data/BTC_Prices.csv", parse_dates=["Date"]).set_index("Date")["Value"]
          prices = prices[prices > 0].sort_index()
          added = 0
          for row in rows:
              date = pd.to_datetime(row["time"][:10])
              if date in df["Date"].values:
                  continue
              mvrv = float(row.get("CapMVRVCur", 0))
              if mvrv <= 0:
                  print(f"Skip {date:%Y-%m-%d}: invalid MVRV")
                  continue
              # Prefer exact price; else linear interpolate between nearest valid prices
              if date in prices.index:
                  price = float(prices.loc[date])
              else:
                  before = prices[prices.index < date]
                  after = prices[prices.index > date]
                  if len(before) and len(after):
                      t0, p0 = before.index[-1], float(before.iloc[-1])
                      t1, p1 = after.index[0], float(after.iloc[0])
                      frac = (date - t0).total_seconds() / (t1 - t0).total_seconds()
                      price = p0 + frac * (p1 - p0)
                      print(f"Interpolated price for {date:%Y-%m-%d}: {price:.2f}")
                  elif len(before):
                      price = float(before.iloc[-1])
                      print(f"Carried forward price for {date:%Y-%m-%d}: {price:.2f}")
                  else:
                      print(f"Skip {date:%Y-%m-%d}: no price reference")
                      continue
              realized = price / mvrv
              new = pd.DataFrame({"Date": [date], "Price": [price], "MVRV": [mvrv], "Realized": [realized]})
              df = pd.concat([df, new], ignore_index=True)
              added += 1
              print(f"Added {date:%Y-%m-%d}: price {price:.0f}, MVRV {mvrv:.3f}")
          if added:
              df = df.sort_values("Date").drop_duplicates("Date", keep="last")
              df.to_csv(path, index=False)
              print(f"Wrote {added} new row(s)")
          else:
              print("No new rows")
          PY
      - name: Commit
        run: |
          git config user.name "Carlos Massa"
          git config user.email "47972273+carlosmassa@users.noreply.github.com"
          git add data/BTC_MVRV.csv
          git diff --staged --quiet || git commit -m "Update MVRV data" && git push
