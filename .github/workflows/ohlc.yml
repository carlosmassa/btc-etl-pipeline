name: Update BTC OHLC
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ohlc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install pandas requests
      - run: python fetch_ohlc.py
      - name: Commit updated OHLC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/BTC_OHLC.csv
          git diff --staged --quiet || git commit -m "Update BTC OHLC for $(date +%Y-%m-%d)"
          git push
